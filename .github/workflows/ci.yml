name: Reflex CI

on:
  # The release PR touches only these two files and is opened by
  # github-actions[bot], whose runs wait for approval; it merges at once, so
  # those runs would only expire and show red. The release is tested on main.
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes its in-flight run. Each run on main has a
# group of its own (its run id), so none is cancelled or replaced while
# pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Top-level least-privilege default.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (clang-format)
    # 24.04 for a clang-format (18.x) that supports the IncludeBlocks/Regroup
    # options in .clang-format.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: clang-format version
        # Preinstalled on ubuntu-24.04 (runner-images: clang 18 default, with the
        # clang-format alternative). No apt step, so no mirror dependency.
        run: clang-format --version
      - name: clang-format --dry-run on tracked C/C++ sources
        run: |
          set -e
          files=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx' '*.hxx')
          if [ -z "$files" ]; then
            echo "No C/C++ source files tracked — skipping clang-format."
            exit 0
          fi
          echo "Checking $(echo "$files" | wc -l) files."
          echo "$files" | xargs clang-format --dry-run --Werror

  # The plans and ADRs (docs/plan/, docs/adr/) are published on the
  # architecture site (branes-ai/architecture). Its check runs here, strict, so
  # a plan without a status, an ADR without a status block, or a broken link
  # fails this PR rather than the site's hourly build.
  records:
    name: Architecture records
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: branes-ai/architecture/actions/check-records@05e845c5215b7284e99af4517e4299f3167600a4  # main after architecture#12
        with:
          strict: 'true'

  # Dual-compiler validation on Linux: GCC and Clang, Debug (contract asserts
  # live) and Release (optimized, asserts compiled out).
  build-and-test-linux:
    name: Build and Test (Linux - ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-release, clang-debug, clang-release]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Compiler versions
        # gcc/g++ 13 and clang/clang++ 18 are preinstalled on ubuntu-24.04; no apt
        # step, so no dependency on the Ubuntu mirror.
        run: |
          g++ --version | head -1
          clang++ --version | head -1
      - name: Install CMake 4.x + Ninja
        # The project requires CMake >= 4.0; runner images and distro apt
        # packages can lag, so pin the toolchain explicitly.
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb  # v4.4.2
        with:
          cmakeVersion: "~4.0.0"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  build-and-test-windows:
    name: Build and Test (Windows - MSVC ${{ matrix.label }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: msvc-ninja,       label: Release }
          - { preset: msvc-ninja-debug, label: Debug }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Set up the MSVC environment (vcvars x64)
        # The Ninja generator needs cl.exe on PATH and INCLUDE/LIB set.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64
      - name: Install CMake 4.x + Ninja
        # Runs after msvc-dev-cmd so it is prepended ahead of the VS-bundled
        # CMake 3.x that vcvars puts on PATH.
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb  # v4.4.2
        with:
          cmakeVersion: "~4.0.0"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Docs traces (docs/standards/animation, ANI-3 and ANI-12): every committed
  # reflex-trace/1 file is valid and equivalent, under the `regen` profile, to
  # a fresh run of its scenario with both Linux compilers; the docs site builds
  # (TracePlayer refuses invalid traces); and the size budget holds.
  docs-traces:
    name: Docs traces
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Install CMake 4.x + Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb  # v4.4.2
        with:
          cmakeVersion: "~4.0.0"
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci
      - name: Validate committed traces
        working-directory: docs-site
        run: npm run traces:check
      - name: Regenerate traces (gcc) and compare
        run: |
          cmake --preset gcc-release -DREFLEX_BUILD_TESTS=OFF -DREFLEX_BUILD_BENCH=OFF
          scripts/gen-traces.sh gcc-release build/traces-gcc
          (cd docs-site && npm run traces:check -- --regen ../build/traces-gcc)
      - name: Regenerate traces (clang) and compare
        run: |
          cmake --preset clang-release -DREFLEX_BUILD_TESTS=OFF -DREFLEX_BUILD_BENCH=OFF
          scripts/gen-traces.sh clang-release build/traces-clang
          (cd docs-site && npm run traces:check -- --regen ../build/traces-clang)
      - name: Build the WebAssembly module (pinned emsdk) and compare with native
        # Tier 2 of docs/standards/animation: the live widgets' scenarios,
        # compiled to Wasm, must agree with the committed native traces under
        # the wasm equivalence profile.
        run: |
          scripts/install-emsdk.sh "$RUNNER_TEMP/emsdk"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          scripts/build-wasm.sh
          (cd docs-site && npm run wasm-agree)
      - name: Build docs site
        working-directory: docs-site
        run: npm run build
      - name: Check the site's links and anchors
        # The site is generated from docs/ by docs-kit: a broken relative link
        # or anchor in a document fails here, before the deploy.
        working-directory: docs-site
        run: npm run check
      - name: Size budget
        working-directory: docs-site
        run: npm run size-budget -- --require-wasm
