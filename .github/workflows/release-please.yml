name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

  trace-player:
    # The shared trace player (packages/trace-player) ships with each release
    # as an npm tarball, which consuming docs sites (racing-drone) pin by URL:
    # https://github.com/branes-ai/reflex/releases/download/<tag>/branes-ai-trace-player-<version>.tgz
    name: Attach the trace player package
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Pack and upload
        working-directory: packages/trace-player
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "packages/trace-player is at $version, but the release is $TAG" >&2
            exit 1
          fi
          npm pack
          gh release upload "$TAG" "branes-ai-trace-player-$version.tgz" --repo "$GITHUB_REPOSITORY"
      # After the upload, so a stale README never holds the package back. The
      # README's install snippet names the version once, on the line
      # release-please rewrites (x-release-please-version); the URL below it
      # must build both the tag and the file name from that variable.
      - name: Check the README's install version
        working-directory: packages/trace-player
        run: |
          version=$(node -p "require('./package.json').version")
          readme=$(sed -n 's/^version=\([^ ]*\)  # x-release-please-version$/\1/p' README.md)
          if [ "$readme" != "$version" ]; then
            echo "README.md installs version '${readme:-none}', but the package is $version" >&2
            exit 1
          fi
          url='releases/download/v$version/branes-ai-trace-player-$version.tgz'
          if ! grep -qF "$url" README.md; then
            echo "README.md's install URL does not build the tag and file name from \$version" >&2
            exit 1
          fi
